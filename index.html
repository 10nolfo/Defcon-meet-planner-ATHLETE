<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach App — Athlètes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e8eaf0; min-height: 100vh; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 240px; background: #161b27; border-right: 1px solid #1e2535; padding: 0; flex-shrink: 0; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; flex-direction: column; }

  /* Sidebar */
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid #1e2535; display: flex; align-items: center; gap: 10px; }
  .sidebar-logo svg { width: 22px; height: 22px; }
  .sidebar-logo-text { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: #e8eaf0; }
  .sidebar-logo-sub { font-size: 10px; color: #e05a3a; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

  .sidebar-section { padding: 16px 10px 8px; }
  .sidebar-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #4a5568; font-weight: 600; padding: 0 8px 8px; }

  .athlete-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; width: 100%; border: none; background: none; text-align: left; color: #e8eaf0; }
  .athlete-item:hover { background: #1e2535; }
  .athlete-item.active { background: #1e2535; }
  .athlete-avatar-sm { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .athlete-name-sm { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .athlete-cat-sm { font-size: 11px; color: #4a5568; }

  .add-btn { margin: 0 10px 16px; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; border: 1px dashed #2a3347; background: none; color: #6b7a99; cursor: pointer; font-size: 13px; transition: all 0.15s; width: calc(100% - 20px); }
  .add-btn:hover { border-color: #e05a3a; color: #e05a3a; background: rgba(224,90,58,0.05); }

  /* Header */
  .main-header { padding: 16px 28px; border-bottom: 1px solid #1e2535; display: flex; align-items: center; gap: 12px; background: #161b27; }
  .main-header h1 { font-size: 16px; font-weight: 600; flex: 1; }
  .back-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #1e2535; background: none; color: #6b7a99; cursor: pointer; font-size: 13px; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .back-btn:hover { border-color: #2a3347; color: #e8eaf0; }

  /* Main content */
  .main-content { flex: 1; padding: 28px; overflow-y: auto; }

  /* Empty state */
  .empty-state { text-align: center; padding: 64px 24px; color: #4a5568; }
  .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 15px; color: #6b7a99; margin-bottom: 6px; }
  .empty-state small { font-size: 13px; }

  /* Profile */
  .profile-header { display: flex; align-items: center; gap: 16px; padding: 20px; background: #161b27; border: 1px solid #1e2535; border-radius: 12px; margin-bottom: 20px; }
  .profile-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
  .profile-name { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
  .profile-meta { font-size: 13px; color: #6b7a99; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-red { background: rgba(224,90,58,0.15); color: #e05a3a; }
  .badge-blue { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .openipf-link { margin-left: auto; font-size: 12px; color: #4a5568; text-decoration: none; display: flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1px solid #1e2535; border-radius: 8px; transition: all 0.15s; }
  .openipf-link:hover { color: #e8eaf0; border-color: #2a3347; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: #161b27; border: 1px solid #1e2535; border-radius: 10px; padding: 14px 16px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #4a5568; font-weight: 600; margin-bottom: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; color: #e8eaf0; }
  .stat-value.accent { color: #e05a3a; }
  .stat-unit { font-size: 12px; color: #6b7a99; font-weight: 400; }

  /* Table */
  .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #4a5568; margin-bottom: 12px; }
  .table-wrap { background: #161b27; border: 1px solid #1e2535; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { border-bottom: 1px solid #1e2535; }
  th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #4a5568; }
  th.r { text-align: right; }
  td { padding: 10px 14px; border-bottom: 1px solid #0f1117; }
  td.r { text-align: right; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .pr-cell { color: #e05a3a; font-weight: 700; }
  .place-1 { color: #f6c90e; font-weight: 700; }
  .place-2 { color: #c0c0c0; font-weight: 600; }
  .place-3 { color: #cd7f32; font-weight: 600; }

  /* Loading */
  .loading { display: flex; flex-direction: column; align-items: center; padding: 60px; color: #4a5568; gap: 14px; }
  .spinner { width: 32px; height: 32px; border: 2px solid #1e2535; border-top-color: #e05a3a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal { background: #161b27; border: 1px solid #2a3347; border-radius: 16px; padding: 24px; width: 100%; max-width: 440px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .close-btn { background: none; border: none; cursor: pointer; color: #4a5568; padding: 4px; border-radius: 6px; transition: color 0.15s; }
  .close-btn:hover { color: #e8eaf0; }

  .input-row { display: flex; gap: 8px; margin-bottom: 6px; }
  input[type="text"] { flex: 1; background: #0f1117; border: 1px solid #2a3347; border-radius: 8px; padding: 9px 13px; color: #e8eaf0; font-size: 14px; outline: none; transition: border-color 0.15s; }
  input[type="text"]::placeholder { color: #4a5568; }
  input[type="text"]:focus { border-color: #e05a3a; }

  .search-btn { padding: 9px 16px; background: #e05a3a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.15s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .search-btn:hover { background: #c94f31; }
  .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .search-hint { font-size: 12px; color: #4a5568; margin-bottom: 16px; }

  .found-card { background: #0f1117; border: 1px solid #2a3347; border-radius: 10px; padding: 16px; }
  .found-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .found-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .found-stat { text-align: center; }
  .found-stat-v { font-size: 15px; font-weight: 700; color: #e05a3a; }
  .found-stat-l { font-size: 10px; color: #4a5568; text-transform: uppercase; letter-spacing: 0.8px; }

  .confirm-btn { width: 100%; padding: 10px; background: none; border: 1px solid #2a3347; border-radius: 8px; color: #e8eaf0; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .confirm-btn:hover { background: #e05a3a; border-color: #e05a3a; }

  .error-box { background: rgba(224,90,58,0.1); border: 1px solid rgba(224,90,58,0.3); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #e05a3a; }
  .modal-footer { font-size: 11px; color: #4a5568; margin-top: 14px; display: flex; align-items: center; gap: 6px; }

  .load-profile-btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px dashed #2a3347; border-radius: 8px; background: none; color: #6b7a99; cursor: pointer; font-size: 14px; transition: all 0.15s; }
  .load-profile-btn:hover { border-color: #e05a3a; color: #e05a3a; }

  /* Colors for avatars */
  .av-red { background: rgba(224,90,58,0.2); color: #e05a3a; }
  .av-blue { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .av-green { background: rgba(52,211,153,0.2); color: #34d399; }
  .av-purple { background: rgba(167,139,250,0.2); color: #a78bfa; }
  .av-amber { background: rgba(251,191,36,0.2); color: #fbbf24; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e05a3a" stroke-width="2" stroke-linecap="round"><path d="M6 9H4a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><line x1="6" y1="12" x2="18" y2="12"/><circle cx="10" cy="12" r="3"/><circle cx="14" cy="12" r="3"/></svg>
      <div>
        <div class="sidebar-logo-text">CoachPro</div>
        <div class="sidebar-logo-sub">Powerlifting</div>
      </div>
    </div>
    <div class="sidebar-section" style="flex:1;">
      <div class="sidebar-label">Mon équipe</div>
      <div id="athleteList"></div>
    </div>
    <div style="padding-bottom:12px;">
      <button class="add-btn" onclick="openModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Ajouter un athlète
      </button>
    </div>
  </div>

  <div class="main">
    <div class="main-header" id="mainHeader">
      <h1 id="headerTitle">Mon équipe</h1>
    </div>
    <div class="main-content" id="mainContent"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Ajouter un athlète</div>
      <button class="close-btn" onclick="closeModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="input-row">
      <input type="text" id="searchInput" placeholder="ex: juliend  ou  openipf.org/u/juliend" onkeydown="if(event.key==='Enter')doSearch()" />
      <button class="search-btn" id="searchBtn" onclick="doSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Rechercher
      </button>
    </div>
    <div class="search-hint">Collez l'URL du profil OpenIPF ou le nom d'utilisateur.<br><a href="https://www.openipf.org" target="_blank" style="color:#e05a3a;text-decoration:none;">↗ Trouver un athlète sur openipf.org</a></div>
    <div id="searchResult"></div>
    <div class="modal-footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Données issues de openipf.org
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const athletes = [];
let selectedId = null;
let idCounter = 1;
let pendingResult = null;

const COLORS = ['av-red','av-blue','av-green','av-purple','av-amber'];
function avatarColor(id) { return COLORS[id % COLORS.length]; }
function initials(name) { return name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

// ─── OpenIPF API (via proxy Vercel) ───────────────────────────────────────────
async function fetchLifter(username) {
  const resp = await fetch(`/api/lifter?username=${encodeURIComponent(username)}`);
  if (!resp.ok) throw new Error(`Erreur serveur (${resp.status})`);
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function extractUsername(input) {
  // Accept: full URL, /u/username, or just username
  input = input.trim();
  const match = input.match(/\/u\/([a-z0-9_-]+)/i);
  if (match) return match[1].toLowerCase();
  // If it looks like a plain username (no spaces, no slashes)
  if (/^[a-z0-9_-]+$/i.test(input)) return input.toLowerCase();
  return null;
}

// ─── Search & Add ─────────────────────────────────────────────────────────────
async function doSearch() {
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) return;

  const username = extractUsername(raw);
  if (!username) {
    document.getElementById('searchResult').innerHTML = `<div class="error-box">Format invalide. Collez l'URL OpenIPF (ex: openipf.org/u/juliend) ou juste le nom d'utilisateur (ex: juliend).</div>`;
    return;
  }

  const btn = document.getElementById('searchBtn');
  const res = document.getElementById('searchResult');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Chargement…`;
  res.innerHTML = `<div class="loading" style="padding:20px;"><div class="spinner"></div><small>Récupération depuis OpenIPF…</small></div>`;
  pendingResult = null;

  try {
    const obj = await fetchLifter(username);
    pendingResult = obj;
    renderFoundCard(obj, res);
  } catch(e) {
    res.innerHTML = `<div class="error-box">Erreur : ${e.message}<br><small>Vérifiez que le nom d'utilisateur existe bien sur openipf.org/u/${username}</small></div>`;
  }
  btn.disabled = false;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Charger`;
}

async function selectSearchResult(username) {
  const res = document.getElementById('searchResult');
  res.innerHTML = `<div class="loading" style="padding:20px;"><div class="spinner"></div><small>Chargement du profil…</small></div>`;
  try {
    const obj = await fetchLifter(username);
    pendingResult = obj;
    renderFoundCard(obj, res);
  } catch(e) {
    res.innerHTML = `<div class="error-box">Erreur : ${e.message}</div>`;
  }
}

function renderFoundCard(obj, container) {
  const b = obj.bestLifts || {};
  const nc = (obj.competitions || []).length;
  const av = COLORS[idCounter % COLORS.length];
  container.innerHTML = `
    <div class="found-card">
      <div class="found-card-header">
        <div class="athlete-avatar-sm ${av}" style="width:38px;height:38px;font-size:13px;font-weight:700;">${initials(obj.name)}</div>
        <div>
          <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${obj.name}</div>
          <div style="display:flex;gap:6px;">
            ${obj.category ? `<span class="badge badge-red">${obj.category}</span>` : ''}
            ${obj.federation ? `<span class="badge badge-blue">${obj.federation}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="found-stats">
        <div class="found-stat"><div class="found-stat-v">${b.squat||'—'}<small style="font-size:10px;color:#4a5568;"> kg</small></div><div class="found-stat-l">Squat</div></div>
        <div class="found-stat"><div class="found-stat-v">${b.bench||'—'}<small style="font-size:10px;color:#4a5568;"> kg</small></div><div class="found-stat-l">Bench</div></div>
        <div class="found-stat"><div class="found-stat-v">${b.deadlift||'—'}<small style="font-size:10px;color:#4a5568;"> kg</small></div><div class="found-stat-l">Soulevé</div></div>
      </div>
      <div style="font-size:12px;color:#4a5568;margin-bottom:12px;">${nc} compétition${nc>1?'s':''} trouvée${nc>1?'s':''} · Total : <strong style="color:#e05a3a;">${b.total||'—'} kg</strong></div>
      <button class="confirm-btn" onclick="addAthlete()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Ajouter à l'équipe
      </button>
    </div>`;
}

function addAthlete() {
  if (!pendingResult) return;
  const a = { id: idCounter++, ...pendingResult };
  athletes.push(a);
  closeModal();
  renderSidebar();
  selectAthlete(a.id);
}

// ─── Profile Loading ──────────────────────────────────────────────────────────
async function loadProfile(id) {
  const a = athletes.find(x => x.id === id);
  if (!a || !a.username) return;
  document.getElementById('mainContent').innerHTML = `<div class="loading"><div class="spinner"></div><p style="font-size:14px;">Chargement depuis OpenIPF…</p></div>`;
  try {
    const data = await fetchLifter(a.username);
    Object.assign(a, data);
  } catch(e) {
    document.getElementById('mainContent').innerHTML = `<div class="error-box" style="margin:20px;">Erreur : ${e.message}</div>`;
    return;
  }
  renderProfile(a);
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('athleteList');
  if (!athletes.length) { list.innerHTML = `<div style="padding: 8px 8px; font-size:12px; color:#4a5568; font-style:italic;">Aucun athlète</div>`; return; }
  list.innerHTML = athletes.map(a => `
    <button class="athlete-item ${selectedId===a.id?'active':''}" onclick="selectAthlete(${a.id})">
      <div class="athlete-avatar-sm ${avatarColor(a.id)}">${initials(a.name)}</div>
      <div style="overflow:hidden;">
        <div class="athlete-name-sm">${a.name}</div>
        <div class="athlete-cat-sm">${a.category||'—'}</div>
      </div>
    </button>`).join('');
}

function selectAthlete(id) {
  selectedId = id;
  const a = athletes.find(x => x.id === id);
  renderSidebar();
  document.getElementById('headerTitle').textContent = a.name;
  if (!a.competitions) {
    renderProfileSkeleton(a);
  } else {
    renderProfile(a);
  }
}

function renderProfileSkeleton(a) {
  const av = avatarColor(a.id);
  document.getElementById('mainContent').innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar ${av}">${initials(a.name)}</div>
      <div style="flex:1;">
        <div class="profile-name">${a.name}</div>
        <div class="profile-meta">
          ${a.category ? `<span class="badge badge-red">${a.category}</span>` : ''}
          ${a.federation ? `<span class="badge badge-blue">${a.federation}</span>` : ''}
        </div>
      </div>
      ${a.openipfUrl ? `<a href="${a.openipfUrl}" class="openipf-link" target="_blank">↗ OpenIPF</a>` : ''}
    </div>
    <div style="text-align:center; padding: 60px 20px; color: #4a5568;">
      <div style="font-size: 36px; margin-bottom: 12px;">📊</div>
      <p style="margin-bottom: 6px; color: #6b7a99;">Profil non encore chargé</p>
      <small style="display:block; margin-bottom: 20px;">Cliquez pour récupérer l'historique depuis OpenIPF</small>
      <button class="load-profile-btn" onclick="loadProfile(${a.id})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.67"/></svg>
        Charger depuis OpenIPF
      </button>
    </div>`;
}

function renderProfile(a) {
  const av = avatarColor(a.id);
  const b = a.bestLifts || {};
  const comps = a.competitions || [];
  
  // Find PR row per lift to highlight
  const maxSq = Math.max(...comps.map(c=>c.squat||0));
  const maxBn = Math.max(...comps.map(c=>c.bench||0));
  const maxDl = Math.max(...comps.map(c=>c.deadlift||0));
  const maxTo = Math.max(...comps.map(c=>c.total||0));

  const placeClass = p => p==1?'place-1':p==2?'place-2':p==3?'place-3':'';

  document.getElementById('mainContent').innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar ${av}">${initials(a.name)}</div>
      <div style="flex:1;">
        <div class="profile-name">${a.name}</div>
        <div class="profile-meta" style="margin-top:6px;">
          ${a.category ? `<span class="badge badge-red">${a.category}</span>` : ''}
          ${a.federation ? `<span class="badge badge-blue">${a.federation}</span>` : ''}
          <span style="font-size:13px;">${comps.length} compétition${comps.length!==1?'s':''}</span>
        </div>
      </div>
      ${a.openipfUrl ? `<a href="${a.openipfUrl}" class="openipf-link" target="_blank">↗ OpenIPF</a>` : ''}
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Meilleur Squat</div><div class="stat-value accent">${b.squat||'—'} <span class="stat-unit">kg</span></div></div>
      <div class="stat-card"><div class="stat-label">Meilleur Bench</div><div class="stat-value accent">${b.bench||'—'} <span class="stat-unit">kg</span></div></div>
      <div class="stat-card"><div class="stat-label">Meilleur Soulevé</div><div class="stat-value accent">${b.deadlift||'—'} <span class="stat-unit">kg</span></div></div>
      <div class="stat-card"><div class="stat-label">Meilleur Total</div><div class="stat-value">${b.total||'—'} <span class="stat-unit">kg</span></div></div>
    </div>

    <div class="section-title">Historique des compétitions</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Compétition</th><th>Lieu</th>
          <th class="r">BW</th><th class="r">Squat</th><th class="r">Bench</th><th class="r">Soulevé</th><th class="r">Total</th><th class="r">Rang</th>
        </tr></thead>
        <tbody>
          ${comps.length ? comps.map(c => `
            <tr>
              <td style="color:#6b7a99;white-space:nowrap;">${c.date||'—'}</td>
              <td style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${c.meet||'—'}</td>
              <td style="color:#6b7a99;">${c.location||'—'}</td>
              <td class="r" style="color:#6b7a99;">${c.bodyweight||'—'}</td>
              <td class="r ${c.squat===maxSq&&c.squat?'pr-cell':''}">${c.squat||'—'}</td>
              <td class="r ${c.bench===maxBn&&c.bench?'pr-cell':''}">${c.bench||'—'}</td>
              <td class="r ${c.deadlift===maxDl&&c.deadlift?'pr-cell':''}">${c.deadlift||'—'}</td>
              <td class="r ${c.total===maxTo&&c.total?'pr-cell':''}" style="font-weight:600;">${c.total||'—'}</td>
              <td class="r ${placeClass(c.place)}">${c.place?'#'+c.place:'—'}</td>
            </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;padding:24px;color:#4a5568;">Aucune compétition</td></tr>`}
        </tbody>
      </table>
    </div>
    ${comps.length ? `<div style="margin-top:8px;font-size:11px;color:#4a5568;text-align:right;"><span style="color:#e05a3a;font-weight:700;">■</span> Record personnel</div>` : ''}
  `;
}

function renderTeamView() {
  document.getElementById('headerTitle').textContent = 'Mon équipe';
  selectedId = null;
  renderSidebar();
  if (!athletes.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <p>Aucun athlète dans l'équipe</p>
        <small>Ajoutez vos athlètes via le bouton ci-dessous<br>pour consulter leur historique OpenIPF</small>
      </div>`;
  } else {
    document.getElementById('mainContent').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;">
        ${athletes.map(a => `
          <button onclick="selectAthlete(${a.id})" style="background:#161b27;border:1px solid #1e2535;border-radius:12px;padding:16px;cursor:pointer;text-align:left;transition:border-color 0.15s;color:#e8eaf0;" onmouseenter="this.style.borderColor='#2a3347'" onmouseleave="this.style.borderColor='#1e2535'">
            <div class="athlete-avatar-sm ${avatarColor(a.id)}" style="width:40px;height:40px;font-size:14px;font-weight:700;margin-bottom:12px;">${initials(a.name)}</div>
            <div style="font-size:14px;font-weight:600;margin-bottom:4px;">${a.name}</div>
            <div style="font-size:12px;color:#6b7a99;">${a.category||'—'} · ${(a.competitions||[]).length} compét.</div>
          </button>`).join('')}
      </div>`;
  }
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResult').innerHTML = '';
  pendingResult = null;
  setTimeout(() => document.getElementById('searchInput').focus(), 50);
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderSidebar();
renderTeamView();
</script>
</body>
</html>
