  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── FFForce Calendar Integration ── */

    .ff-ai-badge { display:inline-flex; align-items:center; gap:5px; background:rgba(58,123,213,0.12); border:1px solid rgba(58,123,213,0.25); color:var(--ff-blue); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; padding:4px 9px; font-family:'Barlow',sans-serif; }

    .ff-grid-bg { position:fixed; inset:0; background-image:linear-gradient(rgba(230,57,70,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(230,57,70,0.025) 1px,transparent 1px); background-size:48px 48px; pointer-events:none; z-index:0; }

    /* ── FFForce Règlement ── */
    .rgl-screen { flex:1; display:flex; flex-direction:column; overflow:hidden; animation:fadeUp .35s ease; }

    .rgl-rule-card { background:var(--rgl-surface); border:1px solid var(--rgl-border); overflow:hidden; transition:border-color .18s; animation:fadeUp .3s ease both; border-radius:13px; }
    .rgl-rule-header { display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; user-select:none; }
    .rgl-rule-icon { font-size:15px; flex-shrink:0; }
    .rgl-rule-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.3px; text-transform:uppercase; flex:1; color:var(--rgl-text); }
    .rgl-rule-chevron { font-size:11px; color:var(--rgl-muted); transition:transform .2s; }
    .rgl-rule-card.open .rgl-rule-chevron { transform:rotate(180deg); color:var(--rgl-accent); }
    .rgl-rule-body { padding:12px 15px 14px; font-family:'Barlow',sans-serif; font-size:13px; color:var(--rgl-muted); line-height:1.7; border-top:1px solid var(--rgl-border); }
    .rgl-rule-body strong { color:var(--rgl-text); }

    .rgl-rule-body ul li { display:flex; gap:8px; align-items:flex-start; }
    .rgl-rule-body ul li::before { content:'—'; color:var(--rgl-accent); flex-shrink:0; font-weight:700; }
    .rgl-rule-body .rgl-tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 8px; margin:2px 3px 2px 0; border-radius:4px; }
    .rgl-rule-body .rgl-card-rouge { background:rgba(232,88,88,0.11); border:1px solid rgba(232,88,88,0.32); color:#e85858; }
    .rgl-rule-body .rgl-card-bleu  { background:rgba(96,146,232,0.11); border:1px solid rgba(96,146,232,0.32); color:#6092e8; }
    .rgl-rule-body .rgl-card-jaune { background:rgba(212,168,67,0.13); border:1px solid rgba(212,168,67,0.32); color:#d4a843; }
    .rgl-rule-body .rgl-lumiere-blanc { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22); color:#e0e8f4; }
    .rgl-rule-body .rgl-lumiere-rouge { background:rgba(232,88,88,0.11); border:1px solid rgba(232,88,88,0.32); color:#e85858; }
    .rgl-rule-body table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
    .rgl-rule-body th { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--rgl-muted); padding:6px 8px; text-align:left; border-bottom:1px solid var(--rgl-border); font-weight:700; }
    .rgl-rule-body td { padding:6px 8px; border-bottom:1px solid var(--rgl-border); color:var(--rgl-text); vertical-align:top; }
    .rgl-rule-body tr:last-child td { border-bottom:none; }
    .rgl-source-note { font-size:10px; color:var(--rgl-muted); padding:10px 16px; border-top:1px solid var(--rgl-border); text-align:center; font-family:'Barlow',sans-serif; flex-shrink:0; background:var(--rgl-headerbg); }
</style>

<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#04070d;color:#2e3d52;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.16em;">
    DEFCON ·
  </div>
</div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, createContext, useContext } = React;

// ─── Thèmes — identiques à l'app coach ───────────────────────────────────────
const DARK = {
  bg:"#04070d", bg2:"#090e1a",
  surface:"rgba(255,255,255,0.035)", surface2:"rgba(255,255,255,0.065)",
  border:"rgba(255,255,255,0.082)", border2:"rgba(255,255,255,0.15)",
  gold:"#d4a843", goldDim:"rgba(212,168,67,0.13)", goldBorder:"rgba(212,168,67,0.32)",
  red:"#e85858",  redDim:"rgba(232,88,88,0.11)",    redBorder:"rgba(232,88,88,0.32)",
  green:"#3dba82",greenDim:"rgba(61,186,130,0.11)", greenBorder:"rgba(61,186,130,0.32)",
  blue:"#6092e8", blueDim:"rgba(96,146,232,0.11)",  blueBorder:"rgba(96,146,232,0.32)",
  text:"#e0e8f4", muted:"#48586e",
  squat:"#f0a020",    squatDim:"rgba(240,160,32,0.13)",
  bench:"#6092e8",    benchDim:"rgba(96,146,232,0.13)",
  deadlift:"#e85858", deadliftDim:"rgba(232,88,88,0.13)",
  headerBg:"rgba(4,7,13,0.97)", navBg:"rgba(4,7,13,0.98)", overlay:"rgba(0,0,0,0.82)",
};
const LIGHT = {
  bg:"#f1f5fa", bg2:"#e5edf6",
  surface:"rgba(0,0,0,0.038)", surface2:"rgba(0,0,0,0.068)",
  border:"rgba(0,0,0,0.09)", border2:"rgba(0,0,0,0.16)",
  gold:"#9e6408", goldDim:"rgba(158,100,8,0.09)", goldBorder:"rgba(158,100,8,0.30)",
  red:"#c03232",  redDim:"rgba(192,50,50,0.09)",  redBorder:"rgba(192,50,50,0.3)",
  green:"#1f8862",greenDim:"rgba(31,136,98,0.09)", greenBorder:"rgba(31,136,98,0.3)",
  blue:"#2a58be", blueDim:"rgba(42,88,190,0.1)",  blueBorder:"rgba(42,88,190,0.3)",
  text:"#16202c", muted:"#60718c",
  squat:"#b86308",    squatDim:"rgba(184,99,8,0.1)",
  bench:"#2a58be",    benchDim:"rgba(42,88,190,0.12)",
  deadlift:"#c03232", deadliftDim:"rgba(192,50,50,0.12)",
  headerBg:"rgba(241,245,250,0.97)", navBg:"rgba(241,245,250,0.98)", overlay:"rgba(0,0,0,0.52)",
};

function makeStyles(C) {
  return {
    inp: { background:C.surface2, border:`1px solid ${C.border}`, borderRadius:11, color:C.text, padding:"12px 14px", fontSize:15, fontFamily:"'DM Mono',monospace", outline:"none", width:"100%", display:"block", transition:"border-color 0.18s, box-shadow 0.18s" },
    btnGold:   { background:`linear-gradient(135deg, ${C.gold}1E 0%, ${C.gold}0A 100%)`, border:`1px solid ${C.goldBorder}`, borderRadius:13, color:C.gold, fontSize:14, fontWeight:700, padding:"14px 20px", width:"100%", letterSpacing:"0.07em", boxShadow:`0 4px 22px ${C.gold}10` },
    btnGhost:  { background:C.surface, border:`1px solid ${C.border2}`, borderRadius:13, color:C.muted, fontSize:13, fontWeight:600, padding:"12px 16px", width:"100%" },
    btnSm:     { background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, color:C.muted, fontSize:11, fontWeight:600, padding:"5px 11px", letterSpacing:"0.02em" },
    btnDanger: { background:C.redDim, border:`1px solid ${C.redBorder}`, borderRadius:8, color:C.red, fontSize:11, fontWeight:600, padding:"5px 10px" },
  };
}
const ThemeCtx = createContext(null);
const useTheme = () => useContext(ThemeCtx);

// ─── Constantes ───────────────────────────────────────────────────────────────
const MOV_ORDER = ["squat","bench","deadlift"];
const PLANS = [
  { key:"conservative", label:"Conservatif" },
  { key:"classic",      label:"Classique"   },
  { key:"aggressive",   label:"Agressif"    },
];
function movColor(C,k){ return {squat:C.squat,bench:C.bench,deadlift:C.deadlift}[k]||C.muted; }
function planColor(C,k){ return {conservative:C.green,classic:C.gold,aggressive:C.red}[k]||C.muted; }

// ─── Utils ────────────────────────────────────────────────────────────────────
function uid(){ return Math.random().toString(36).slice(2,9); }
function timeToMinutes(hhmm){ if(!hhmm)return 0; const[h,m]=hhmm.split(":").map(Number); return h*60+(m||0); }
function minutesToTime(mins){ const v=(((mins%1440)+1440)%1440); const ts=Math.round(v*60); return `${String(Math.floor(ts/3600)).padStart(2,"0")}:${String(Math.floor((ts%3600)/60)).padStart(2,"0")}`; }
function nowSeconds(){ const n=new Date(); return n.getHours()*3600+n.getMinutes()*60+n.getSeconds(); }
function formatDate(iso){ if(!iso)return""; return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}); }
function daysUntil(iso){ if(!iso)return null; const t=new Date();t.setHours(0,0,0,0); const c=new Date(iso+"T00:00:00");c.setHours(0,0,0,0); return Math.round((c-t)/86400000); }

// ─── Planning — identiques à l'app coach ─────────────────────────────────────
function getMovStartTime(comp,groupId,movKey){
  const offsets=comp.movementOffsets||{squat:0,bench:180,deadlift:360};
  const movOffset=offsets[movKey]??0;
  const group=(comp.groups||[]).find(g=>g.id===groupId);
  const groupOffset=group?.offset??0;
  const extraOffset=comp.groupMovOffsets?.[groupId]?.[movKey]??0;
  return minutesToTime(timeToMinutes(comp.compStartTime||"10:00")+movOffset+groupOffset+extraOffset);
}
function computeSchedule(movConfig,compStartTime,position,delay=0){
  if(!compStartTime||!movConfig)return[];
  const{restBetween=6,setDuration=1.5,bufferBeforeOpener=8,warmupSets=[],generalWarmup}=movConfig;
  const pos=position??1;
  const n=warmupSets.length;
  const liftMin=timeToMinutes(compStartTime)+(pos-1)+delay;
  const sets=[];
  if(n>0){
    const lastStart=liftMin-bufferBeforeOpener-setDuration;
    warmupSets.forEach((set,i)=>{
      const offset=(n-1-i)*(restBetween+setDuration);
      sets.push({...set,index:i,startMin:lastStart-offset,startTime:minutesToTime(lastStart-offset),type:"warmup"});
    });
  }
  if(generalWarmup?.enabled!==false){
    const dur=generalWarmup?.duration??20;
    const anchor=sets.length>0?sets[0].startMin:(liftMin-bufferBeforeOpener-setDuration);
    sets.unshift({id:"general",type:"general",index:-1,startMin:anchor-dur,startTime:minutesToTime(anchor-dur),duration:dur});
  }
  return sets;
}
function setKey(sc){ return sc.type==="general"?"general":String(sc.index); }

// ─── Migration — identique à l'app coach ─────────────────────────────────────
function defaultMovement(){
  return{position:1,openerWeight:"",gamePlan:{attempt2:{conservative:"",classic:"",aggressive:""},attempt3:{conservative:"",classic:"",aggressive:""}},doneSets:{},restBetween:6,setDuration:1.5,bufferBeforeOpener:8,generalWarmup:{enabled:true,duration:20},warmupSets:[{id:uid(),weight:0},{id:uid(),weight:70},{id:uid(),weight:120}]};
}
function migrateAthleteMovement(m,fallback){
  const def=defaultMovement();
  if(!m)return def;
  const fb=fallback||{};
  const warmupSets=(m.warmupSets&&m.warmupSets.length>0)?m.warmupSets.map(s=>({...s,id:s.id||uid()})):(fb.warmupSets&&fb.warmupSets.length>0)?fb.warmupSets.map(s=>({...s,id:s.id||uid()})):def.warmupSets;
  return{position:m.position??1,openerWeight:m.openerWeight??"",gamePlan:m.gamePlan||def.gamePlan,doneSets:m.doneSets||{},restBetween:m.restBetween??fb.restBetween??def.restBetween,setDuration:m.setDuration??fb.setDuration??def.setDuration,bufferBeforeOpener:m.bufferBeforeOpener??fb.bufferBeforeOpener??def.bufferBeforeOpener,generalWarmup:m.generalWarmup||fb.generalWarmup||def.generalWarmup,warmupSets};
}
function migrateComp(c){
  if(!c)return null;
  let out={...c};
  if(!out.groups||!out.groups.length){const g={id:uid(),name:"Groupe 1",offset:0,athleteCount:10};out.groups=[g];out.athletes=(out.athletes||[]).map(a=>({...a,groupId:g.id}));}
  if(!out.compStartTime)out.compStartTime="10:00";
  if(!out.movementOffsets)out.movementOffsets={squat:0,bench:180,deadlift:360};
  const fgId=out.groups[0]?.id;
  const ng=out.groups.map(g=>({id:g.id,name:g.name||"Groupe",offset:g.offset??0,athleteCount:g.athleteCount??10,_lm:g.movements}));
  out.athletes=(out.athletes||[]).map(a=>{
    const gId=a.groupId&&ng.find(g=>g.id===a.groupId)?a.groupId:fgId;
    const grp=ng.find(g=>g.id===gId);const lm=grp?._lm;
    return{...a,groupId:gId,movements:{squat:migrateAthleteMovement(a.movements?.squat,lm?.squat),bench:migrateAthleteMovement(a.movements?.bench,lm?.bench),deadlift:migrateAthleteMovement(a.movements?.deadlift,lm?.deadlift)}};
  });
  out.groups=ng.map(({_lm,...g})=>g);
  return out;
}

const FB_URL="https://defconmeetplanertest1-default-rtdb.europe-west1.firebasedatabase.app";
function fetchTO(url,opts,ms=8000){return new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error("timeout")),ms);fetch(url,opts).then(r=>{clearTimeout(t);res(r);}).catch(e=>{clearTimeout(t);rej(e);});});}
async function fbGet(url,code){try{const r=await fetchTO(`${url}/teams/${encodeURIComponent(code)}.json`,{});if(!r.ok)return null;return await r.json();}catch{return null;}}

// Version détaillée pour le login — retourne l'erreur précise
async function fbGetDetailed(url,code){
  try{
    const r=await fetchTO(`${url}/teams/${encodeURIComponent(code)}.json`,{});
    if(r.status===401||r.status===403)return{error:"rules",status:r.status};

    return{data};
  }catch(e){
    return{error:e.message==="timeout"?"timeout":"network"};
  }
}

// ─── Normalisation des noms (accents, tirets, casse) ─────────────────────────
function normalizeName(s){
  return s.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[-_'.]/g," ")
    .replace(/\s+/g," ");
}

let _ctx=null;
function getCtx(){if(!_ctx){try{_ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(_ctx?.state==="suspended"){try{_ctx.resume();}catch(e){}}return _ctx;}
function tone(freq,dur,vol,when){const ctx=getCtx();if(!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type="sine";const t=when??ctx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}}
// ─── Notification helpers ──────────────────────────────────────────────────
function trySystemNotif(title, body, tag) {
  try {
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;
    // Sur iOS PWA standalone, new Notification() fonctionne directement (iOS 16.4+)
    // On essaie d'abord le Service Worker si disponible, sinon fallback direct
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(reg => {
        reg.showNotification(title, { body, tag, renotify:true, requireInteraction:true });
      }).catch(()=>{ new Notification(title, { body, tag, requireInteraction:true }); });
    } else {
      new Notification(title, { body, tag, requireInteraction:true });
    }
  } catch(e) {
    // Dernier recours — certains iOS acceptent quand même new Notification()
    try { new Notification(title, { body, tag }); } catch(_) {}
  }
}

// ─── Countdown — utilise ThemeCtx comme l'app coach ──────────────────────────
function Countdown({targetMin,sm}){
  const{C}=useTheme();
  const[secs,setSecs]=useState(null);
  useEffect(()=>{const upd=()=>setSecs(Math.round(targetMin*60-nowSeconds()));upd();const iv=setInterval(upd,500);return()=>clearInterval(iv);},[targetMin]);
  if(secs===null)return null;
  const abs=Math.abs(secs),m=Math.floor(abs/60),s=abs%60;
  const txt=`${secs<0?"-":""}${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  const isPast=secs<0,isNow=abs<90;
  return(<span style={{fontFamily:"'DM Mono',monospace",fontSize:sm?11:13,fontWeight:700,padding:sm?"2px 6px":"3px 10px",borderRadius:5,whiteSpace:"nowrap",background:isPast?C.redDim:isNow?C.goldDim:C.surface2,color:isPast?C.red:isNow?C.gold:C.muted,border:`1px solid ${isPast?C.redBorder:isNow?C.goldBorder:C.border}`}}>{txt}</span>);
}

// ─── Hash simple (identique à l'app coach) ────────────────────────────────────
function simpleHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) + h) + str.charCodeAt(i); h = h & h; }
  return h.toString(36);
}

// Étape 1 : saisie du code équipe → charge la liste des athlètes
// Étape 2 : l'athlète tape sur son nom dans la liste (plus de saisie manuelle du prénom)
function LoginScreen({onLogin,initialErr=""}){
  const{C,inp,btnGold,btnGhost}=useTheme();
  const[code,setCode]=useState(localStorage.getItem("defcon_ath_code")||"");
  const[pass,setPass]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState(initialErr);
  // Étape 2 : données chargées, en attente de sélection de l'athlète
  const[loadedData,setLoadedData]=useState(null); // {cfg, data, athletes:[{comp,athlete}]}
  const[search,setSearch]=useState("");

  async function loadTeam(){
    if(!code.trim()){setErr("Saisis le nom de l'équipe.");return;}
    if(!pass.trim()){setErr("Saisis le mot de passe.");return;}
    setLoading(true);setErr("");initAudio();
    const result=await fbGetDetailed(FB_URL,code.trim());
    setLoading(false);
    if(result.error==="rules"){
      setErr("🔴 Accès refusé par Firebase (erreur "+result.status+"). Les règles ont probablement expiré. Dis à ton coach d'aller dans Firebase Console → Realtime Database → Règles et de remettre { \".read\": true, \".write\": true }.");
      return;
    }
    if(result.error==="timeout"){setErr("⏱ Délai dépassé. Vérifie ta connexion internet.");return;}
    if(result.error==="network"){setErr("📡 Impossible de contacter Firebase. Vérifie ta connexion.");return;}
    if(!result.data){setErr("❓ Équipe introuvable — vérifie le nom avec ton coach.");return;}
    // Vérification du mot de passe
    if(!result.data.passwordHash){
      setErr("🔒 Cette équipe n'a pas de mot de passe — elle a été créée avec l'ancienne version. Demande à ton coach de la recréer.");return;
    }
    if(result.data.passwordHash!==simpleHash(pass)){
      setErr("🔒 Mot de passe incorrect.");return;
    }
    // Construire la liste : teamRoster en priorité + athlètes manuels des compétitions
    const roster = result.data.teamRoster || [];
    const compsData = result.data.competitions || [];
    const compAthleteNames = new Set();
    compsData.forEach(comp => (comp.athletes||[]).forEach(a => { if(a?.name) compAthleteNames.add(normalizeName(a.name)); }));
    const rosterNorms = new Set(roster.map(r => normalizeName(r.name)));
    const manualNames = [...compAthleteNames].filter(n => !rosterNorms.has(n));
    const manualAthletes = [];
    const seenManual = new Set();
    compsData.forEach(comp => (comp.athletes||[]).forEach(a => {
      if(!a?.name) return;
      const nn = normalizeName(a.name);
      if(manualNames.includes(nn) && !seenManual.has(nn)){ seenManual.add(nn); manualAthletes.push(a); }
    }));
    if(roster.length===0 && manualAthletes.length===0){
      setErr("⚠️ Aucun athlète trouvé dans cette équipe. Demande à ton coach d'en ajouter.");
      return;
    }
    localStorage.setItem("defcon_ath_code",code.trim());
    setLoadedData({cfg:{url:FB_URL,code:code.trim()},data:result.data,roster,manualAthletes});
  }

  function selectAthlete(entry){
    // entry = { name, rosterAthlete: obj|null }
    localStorage.setItem("defcon_ath_name", entry.name);
    onLogin({url:FB_URL,code:code.trim()}, entry.name, loadedData.data, entry.rosterAthlete||null);
  }

  // ── Étape 2 : liste des athlètes ──────────────────────────────────────────
  if(loadedData){
    const sl=normalizeName(search);

function CompStatusBadge({ dateStr }) {
  if (!dateStr) return null;
  const parts = dateStr.split("/");
  if (parts.length < 3) return <span className="ff-comp-status soon">À venir</span>;
  const d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
  const now = new Date();
  const diff = (d - now) / (1000 * 60 * 60 * 24);
  if (diff < -2) return <span className="ff-comp-status closed">Terminée</span>;
  if (diff < 0)  return <span className="ff-comp-status live">EN COURS</span>;
  if (diff < 14) return <span className="ff-comp-status soon">Bientôt</span>;
  return <span className="ff-comp-status open">Inscriptions ouvertes</span>;
}

// ─── Gemini API key helpers ───────────────────────────────────────────────────
const GEMINI_KEY_LS = "defcon_gemini_key";
function getGeminiKey() { return localStorage.getItem(GEMINI_KEY_LS) || ""; }
function saveGeminiKey(k) { localStorage.setItem(GEMINI_KEY_LS, k.trim()); }

async function fetchFFCompetitions({ keyword, discipline, region, niveau, dateFrom }) {
  const apiKey = getGeminiKey();
  if (!apiKey) throw new Error("CLE_MANQUANTE");

  const filters = [];
  if (discipline && discipline !== "Toutes") filters.push(`discipline: ${discipline}`);
  if (region && region !== "Toutes") filters.push(`région: ${region}`);
  if (niveau && niveau !== "Tous") filters.push(`niveau: ${niveau}`);
  if (keyword) filters.push(`mot-clé: ${keyword}`);
  if (dateFrom) filters.push(`à partir du: ${dateFrom}`);
  const filterStr = filters.length ? `avec les filtres suivants: ${filters.join(", ")}` : "toutes disciplines et régions confondues";

  const prompt = `Tu es un assistant spécialisé en compétitions de force et powerlifting en France.
Recherche sur le web les compétitions FFForce (Fédération Française de Force) ${filterStr} pour 2025-2026.
Consulte le site https://monespace.ffforce.org/manifestations/liste et le site officiel ffforce.fr.
Retourne UNIQUEMENT un JSON valide (sans markdown, sans explication) sous cette forme exacte:
{"competitions":[{"id":"unique_id","nom":"NOM","discipline":"FA/PL/DC/BP","niveau":"National/Régional/International/Open","date":"JJ/MM/AAAA","date_fin":"JJ/MM/AAAA ou null","lieu":"Ville","departement":"Département","region":"Région","club_organisateur":"Nom du club","responsable":"Prénom Nom","contact":"email ou tel","lien":"URL si disponible","categories":["Open","Jeunes","Masters"],"statut":"ouvert/fermé/bientôt"}],"total":0,"source":"FFForce monespace / ffforce.fr","date_maj":"date de mise à jour"}
Donne au moins 6 compétitions réelles et vérifiées si disponibles, sinon donne les plus récentes trouvées.`;

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        tools: [{ google_search: {} }],
        generationConfig: { maxOutputTokens: 3000 }
      })
    }
  );

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    const msg = err?.error?.message || `Erreur ${response.status}`;
    if (response.status === 400 && msg.toLowerCase().includes("api key")) throw new Error("Clé API Gemini invalide. Vérifiez votre clé.");
    if (response.status === 403) throw new Error("Clé API Gemini refusée (403). Vérifiez qu'elle est bien activée sur Google AI Studio.");
    throw new Error(`Gemini API: ${msg}`);
  }

  const data = await response.json();
  const text = (data.candidates?.[0]?.content?.parts || [])
    .filter(p => p.text).map(p => p.text).join("\n");

  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error("Pas de données JSON dans la réponse Gemini");
  return JSON.parse(jsonMatch[0].replace(/```json|```/g, "").trim());
}

        <button className="ff-search-btn" style={{padding:"9px 18px",fontSize:13}}

        La clé est stockée uniquement dans votre navigateur (localStorage). Elle n'est jamais envoyée à un tiers.

  );
}

function FFCalendarScreen() {
  const [keyword, setKeyword] = useState("");
  const [discipline, setDiscipline] = useState("Toutes");
  const [region, setRegion] = useState("Toutes");
  const [niveau, setNiveau] = useState("Tous");
  const [dateFrom, setDateFrom] = useState("");
  const [loading, setLoading] = useState(false);
  const [step, setStep] = useState(0);
  const [results, setResults] = useState(null);
  const [error, setError] = useState(null);
  const [searched, setSearched] = useState(false);
  const [hasKey, setHasKey] = useState(!!getGeminiKey());
  const [showKeyInput, setShowKeyInput] = useState(!getGeminiKey());

  const steps = ["Connexion à Gemini AI","Recherche web Google en cours","Analyse des compétitions","Formatage des résultats"];

  async function doSearch() {
    if (!getGeminiKey()) { setShowKeyInput(true); return; }
    setLoading(true); setError(null); setResults(null); setSearched(true); setStep(0);
    const iv = setInterval(() => setStep(s => Math.min(s + 1, 3)), 900);
    try {
      const data = await fetchFFCompetitions({ keyword, discipline, region, niveau, dateFrom });
      clearInterval(iv); setStep(4); setResults(data);
    } catch (e) {
      clearInterval(iv);
      if (e.message === "CLE_MANQUANTE") { setShowKeyInput(true); setLoading(false); return; }
      setError(e.message || "Erreur de chargement");
    } finally {
      setLoading(false);
    }
  }

  function onKeySaved() { setHasKey(true); setShowKeyInput(false); }

  return (
    <div className="ff-screen">
      <div className="ff-grid-bg"/>
      <div className="ff-screen-header">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
          <div>
            <div className="ff-screen-title">Calendrier <span>FFForce</span></div>

          </div>

// ─── AthletePicker ────────────────────────────────────────────────────────────
function AthletePicker({matches,onPick,onBack}){
  const{C}=useTheme();
  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{borderBottom:`1px solid ${C.border}`,flexShrink:0,background:C.headerBg,backdropFilter:"blur(16px)"}}>
        <div style={{padding:"13px 16px 13px"}}>
          <button onClick={onBack} style={{background:"transparent",border:"none",color:C.muted,fontSize:11,padding:0,marginBottom:12,fontWeight:600,cursor:"pointer",letterSpacing:"0.04em"}}>← retour</button>
          <div style={{fontSize:20,fontWeight:800,color:C.text,letterSpacing:"0.02em"}}>Plusieurs profils</div>
          <div style={{fontSize:12,color:C.muted,marginTop:4}}>Sélectionne le bon profil :</div>
        </div>
      </div>
      <div className="scrollable" style={{flex:1,padding:"12px 18px",display:"flex",flexDirection:"column",gap:10}}>
        {matches.map(({comp,athlete},i)=>{
          const group=comp.groups?.find(g=>g.id===athlete.groupId);const d=daysUntil(comp.date);
          return(<button key={i} onClick={()=>onPick(comp,athlete)}
            style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:"15px 16px",textAlign:"left",display:"flex",flexDirection:"column",gap:6,width:"100%"}}>
            <div style={{fontSize:15,fontWeight:800,color:C.text}}>{athlete.name}</div>
            <div style={{fontSize:13,fontWeight:700,color:C.gold,letterSpacing:"0.01em"}}>{comp.name}</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
              <span style={{fontSize:10,color:C.muted}}>{comp.date?formatDate(comp.date):"Date non définie"}</span>
              {d!==null&&<span style={{fontSize:9,fontWeight:700,letterSpacing:"0.06em",color:d===0?C.red:d>0?C.gold:C.muted,background:d===0?C.redDim:d>0?C.goldDim:C.surface2,border:`1px solid ${d===0?C.redBorder:d>0?C.goldBorder:C.border}`,borderRadius:6,padding:"2px 8px"}}>{d===0?"AUJOURD'HUI":d>0?`J-${d}`:`J+${Math.abs(d)}`}</span>}
              <span style={{fontSize:10,color:C.muted}}>{group?.name||"Groupe 1"}</span>
            </div>
          </button>);
        })}
      </div>
    </div>
  );
}

      </div>

      {/* Onglets de section — scroll horizontal */}
      <div style={{display:"flex",overflowX:"auto",borderBottom:`1px solid ${C.border}`,background:C.bg2,flexShrink:0,scrollbarWidth:"none",position:"relative",zIndex:1}}>
        {REGLEMENT_SECTIONS.map(sec=>{
          const isAct = activeSec===sec.id;
          const col   = SEC_COLORS[sec.id] || C.gold;
          return(
            <button key={sec.id}
              onClick={()=>{setActiveSec(sec.id);setOpenRule(null);}}
              style={{flexShrink:0,padding:"10px 14px",background:"transparent",border:"none",
                borderBottom:isAct?`2px solid ${col}`:"2px solid transparent",
                color:isAct?col:C.muted,cursor:"pointer",
                display:"flex",alignItems:"center",gap:6,
                fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:13,
                letterSpacing:".5px",textTransform:"uppercase",
                transition:"color .18s,border-color .18s",whiteSpace:"nowrap"}}>
              <span style={{fontSize:14}}>{sec.icon}</span>{sec.title}
            </button>
          );
        })}
      </div>

      {/* Liste des règles */}
      <div className="rgl-content">
        {section&&section.rules.map((rule,i)=>{
          const isOpen=openRule===rule.id;
          return(
            <div key={rule.id}
              className={`rgl-rule-card${isOpen?" open":""}`}
              style={{animationDelay:`${i*.07}s`,
                borderColor:isOpen?secColor:C.border,
                background:isOpen?`${secColor}08`:C.surface}}>
              <div className="rgl-rule-header"
                onClick={()=>setOpenRule(isOpen?null:rule.id)}>
                <span className="rgl-rule-icon">{rule.icon}</span>
                <span className="rgl-rule-title"
                  style={{color:isOpen?secColor:C.text}}>{rule.title}</span>
                <span className="rgl-rule-chevron"
                  style={{color:isOpen?secColor:C.muted}}>▼</span>
              </div>
              {isOpen&&(
                <div className="rgl-rule-body"
                  style={{borderTopColor:C.border,color:C.muted}}
                  dangerouslySetInnerHTML={{__html:rule.body}}/>
              )}
            </div>
          );
        })}
        <div style={{height:6}}/>
      </div>

      {/* Note source */}
      <div style={{fontSize:10,color:C.muted,padding:"9px 16px",
        borderTop:`1px solid ${C.border}`,textAlign:"center",
        fontFamily:"'Barlow',sans-serif",flexShrink:0,background:C.bg2}}>
        📖 Source : Règlement IPF 2025 (v2 — 16 mars 2025) · powerlifting.sport / ffforce.fr
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const[darkMode,setDarkMode]=useState(()=>localStorage.getItem("defcon_theme")!=="light");
  const[notifGranted,setNotifGranted]=useState(()=>{try{return Notification?.permission==="granted";}catch(e){return false;}});
  function reqNotifs(){
    initAudio();
    // ── Détection iOS ──────────────────────────────────────────────────────────
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone === true;
    if(isIOS && !isStandalone){
      alert("📱 iPhone / iPad détecté\n\nLes notifications ne fonctionnent que si l'app est installée sur l'écran d'accueil.\n\nComment faire :\n1. Appuie sur ⬆️ (Partager) dans Safari\n2. Sélectionne « Sur l'écran d'accueil »\n3. Ouvre l'app depuis l'écran d'accueil\n4. Reviens ici pour activer les notifications");
      return;
    }
    // ── Vérifications standard ─────────────────────────────────────────────────
    if(!("Notification" in window)){alert("Les notifications ne sont pas supportées sur cet appareil.");return;}
    if(Notification.permission==="granted"){setNotifGranted(true);return;}
    if(Notification.permission==="denied"){alert("Notifications bloquées.\n\niOS : Réglages > Apps > Safari > Notifications\nAutres : réglages du navigateur.");return;}
    try{
      const r=Notification.requestPermission(function(p){setNotifGranted(p==="granted");});
      if(r&&typeof r.then==="function")r.then(p=>setNotifGranted(p==="granted")).catch(()=>{});
    }catch(e){}
  }
  const C=darkMode?DARK:LIGHT;
  const styles=useMemo(()=>makeStyles(C),[darkMode]);
  const themeValue={C,...styles,darkMode,setDarkMode};
  useEffect(()=>{document.body.style.background=C.bg;document.body.style.color=C.text;document.body.className=darkMode?"":"light-mode";},[darkMode]);
  function toggleTheme(){const nd=!darkMode;setDarkMode(nd);localStorage.setItem("defcon_theme",nd?"dark":"light");}

  const[config,setConfig]=useState(null);
  const[rosterProfile,setRosterProfile]=useState(null);
  const[showProfile,setShowProfile]=useState(false);
  const[loading,setLoading]=useState(true);
  const[autoErr,setAutoErr]=useState(""); // erreur lors de la reconnexion auto
  const[comps,setComps]=useState([]);
  const[selCompId,setSelCompId]=useState(null);
  const[selAthleteId,setSelAthleteId]=useState(null);
  const[matches,setMatches]=useState(null);
  const[compChoices,setCompChoices]=useState(null); // compétitions dispo pour l'athlète connecté
  const[homeTab,setHomeTab]=useState("competitions"); // "competitions" | "calendrier"
  const[liveMode,setLiveMode]=useState(false);
  const[selMov,setSelMov]=useState("squat");
  // selTab supprimé : plus d'onglets dans la vue athlète
  const[syncing,setSyncing]=useState(false);
  const[syncErr,setSyncErr]=useState(false);

  const isDirty=useRef(false);
  const saveTimer=useRef(null);
  const esRef=useRef(null);
  const alertRef=useRef({});
  const warnRef=useRef({});

  // Auto-reconnexion
  useEffect(()=>{
    const url=FB_URL;
    const code=localStorage.getItem("defcon_ath_code");
    const name=localStorage.getItem("defcon_ath_name");
    const storedRoster=localStorage.getItem("defcon_ath_roster");
    if(storedRoster){try{setRosterProfile(JSON.parse(storedRoster));}catch{}}
    const cId=localStorage.getItem("defcon_ath_compId");
    const aId=localStorage.getItem("defcon_ath_athId");
    if(code&&name){
      fbGetDetailed(url,code).then(result=>{
        if(result.error==="rules"){
          setAutoErr("🔴 Firebase a refusé la connexion (erreur "+result.status+"). Les règles ont expiré — dis à ton coach de les renouveler dans la console Firebase.");
          setLoading(false);return;
        }
        if(result.error==="timeout"||result.error==="network"){
          setAutoErr("📡 Impossible de joindre Firebase. Vérifie ta connexion internet.");
          setLoading(false);return;
        }
        if(result.data?.competitions){
          const mg=result.data.competitions.map(migrateComp).filter(Boolean);
          setComps(mg);setConfig({url,code});
          // Retrouver toutes les compétitions de l'athlète par son nom
          const nl=normalizeName(name);const found=[];
          mg.forEach(comp=>comp.athletes.forEach(ath=>{if(normalizeName(ath.name)===nl)found.push({comp,athlete:ath});}));
          if(found.length>0)setCompChoices(found);else findAthletes(mg,name);
          subscribeFirebase({url,code});
        }
        setLoading(false);
      });
    }else{setLoading(false);}
  },[]);

  // Sauvegarde auto — lecture-fusion-écriture pour ne pas écraser les nouveaux athlètes du coach
  useEffect(()=>{
    if(!isDirty.current||!config||!comps.length)return;
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      setSyncing(true);
      try{
        // 1. Lire la version la plus récente depuis Firebase
        const latest=await fbGet(config.url,config.code);
        const base=latest?.competitions?(latest.competitions.map(migrateComp).filter(Boolean)):comps;
        // 2. Fusionner : on applique UNIQUEMENT les doneSets locaux sur la base Firebase
        //    (qui peut contenir des athlètes créés par le coach après notre dernier chargement)
        const merged=base.map(comp=>{
          const localComp=comps.find(c=>c.id===comp.id);
          if(!localComp)return comp;
          return{
            ...comp,
            athletes:comp.athletes.map(ath=>{
              const la=localComp.athletes.find(a=>a.id===ath.id);
              if(!la)return ath;
              return{
                ...ath,
                movements:{
                  squat:{...ath.movements.squat,doneSets:la.movements.squat?.doneSets||{}},
                  bench:{...ath.movements.bench,doneSets:la.movements.bench?.doneSets||{}},
                  deadlift:{...ath.movements.deadlift,doneSets:la.movements.deadlift?.doneSets||{}},
                }
              };
            })
          };
        });
        // 3. Mettre à jour l'état local avec la version fusionnée (pour avoir les nouveaux athlètes)
        setComps(merged);
        // 4. Sauvegarder la version fusionnée
        const ok=await fbSet(config.url,config.code,{competitions:merged,version:Date.now()});
        setSyncing(false);setSyncErr(!ok);isDirty.current=false;
      }catch{
        // En cas d'erreur réseau, on sauvegarde quand même avec les données locales
        const ok=await fbSet(config.url,config.code,{competitions:comps,version:Date.now()});
        setSyncing(false);setSyncErr(!ok);isDirty.current=false;
      }
    },700);
  },[comps,config]);

  // Alertes audio en live
  useEffect(()=>{
    if(!liveMode||!selCompId||!selAthleteId)return;
    const comp=comps.find(c=>c.id===selCompId);
    const ath=comp?.athletes?.find(a=>a.id===selAthleteId);
    if(!comp||!ath)return;
    const mov=ath.movements[selMov];
    const cs=getMovStartTime(comp,ath.groupId,selMov);
    const sched=computeSchedule(mov,cs,mov.position||1,0);
    const done=mov.doneSets||{};
    const movName=selMov==="squat"?"Squat":selMov==="bench"?"Bench":"Deadlift";
    const iv=setInterval(()=>{
      const now=nowSeconds();
      sched.forEach(sc=>{
        const k=setKey(sc);if(done[k])return;
        const diff=sc.startMin*60-now;
        if(diff<=32&&diff>24&&!warnRef.current[k]){
          warnRef.current[k]=true;playWarn();
          const lbl=sc.type==="general"?"Éch. général":`Série ${sc.index+1}`;
          const kgPart=sc.type==="warmup"&&sc.weight?` — ${sc.weight}kg`:"";
          const title=`⏱️ ${ath.name} — ${movName}`;
          const body=`${lbl}${kgPart} dans 30s`;
          emitNotif({title,body,urgent:false});
          if(notifGranted)trySystemNotif(title,body,`w-${ath.id}-${k}`);
        }
        if(diff<=3&&diff>-8&&!alertRef.current[k]){
          alertRef.current[k]=true;playAlert();
          try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,500]);}catch(e){}
          const lbl=sc.type==="general"?"Éch. général":`Série ${sc.index+1}`;
          const kgPart=sc.type==="warmup"&&sc.weight?` ${sc.weight}kg`:sc.type==="general"?` (${sc.duration}min)`:"";
          const title=`🚨 ${ath.name} — ${movName}`;
          const body=`C'est l'heure ! ${lbl}${kgPart}`;
          emitNotif({title,body,urgent:true});
          if(notifGranted)trySystemNotif(title,body,`a-${ath.id}-${k}`);
        }
        if(diff<-40){delete alertRef.current[k];delete warnRef.current[k];}
      });
    },500);
    return()=>clearInterval(iv);
  },[liveMode,selMov,comps,selCompId,selAthleteId,notifGranted]);

  function subscribeFirebase(cfg){
    if(esRef.current){esRef.current.close();esRef.current=null;}
    const url=`${cfg.url}/teams/${encodeURIComponent(cfg.code)}.json?alt=sse`;
    try{
      const es=new EventSource(url);esRef.current=es;
      es.addEventListener("put",e=>{
        try{
          const{data}=JSON.parse(e.data);
          if(data?.competitions){
            const mg=data.competitions.map(migrateComp).filter(Boolean);
            // Toujours appliquer les changements de timing/retard (vient du coach)
            // mais préserver les doneSets locaux de l'athlète (ses séries cochées)
            setComps(prev=>mg.map(newComp=>{
              const oldComp=prev.find(c=>c.id===newComp.id);
              if(!oldComp)return newComp;
              return{
                ...newComp,
                athletes:newComp.athletes.map(na=>{
                  const oa=oldComp.athletes.find(a=>a.id===na.id);
                  if(!oa)return na;
                  return{
                    ...na,
                    movements:{
                      squat:{...na.movements.squat,doneSets:oa.movements.squat?.doneSets||{}},
                      bench:{...na.movements.bench,doneSets:oa.movements.bench?.doneSets||{}},
                      deadlift:{...na.movements.deadlift,doneSets:oa.movements.deadlift?.doneSets||{}},
                    }
                  };
                })
              };
            }));
          }
        }catch{}
      });
      es.onerror=()=>setSyncErr(true);es.onopen=()=>setSyncErr(false);
    }catch(e){}
  }

  function findAthletes(compsList,name){
    const nl=normalizeName(name);const found=[];
    compsList.forEach(comp=>comp.athletes.forEach(ath=>{if(normalizeName(ath.name).includes(nl))found.push({comp,athlete:ath});}));
    if(found.length===0){setMatches([]);}
    else{setCompChoices(found);}
  }
  function pickCompetition(comp,ath){
    // Choisir une compétition → aller directement en live
    setSelCompId(comp.id);setSelAthleteId(ath.id);setMatches(null);
    if(ath.currentMovement)setSelMov(ath.currentMovement);
    localStorage.setItem("defcon_ath_compId",comp.id);localStorage.setItem("defcon_ath_athId",ath.id);
    initAudio();setLiveMode(true);
  }
  // Garder pickAthlete comme alias (utilisé par AthletePicker)
  function pickAthlete(comp,ath){pickCompetition(comp,ath);}
  function handleLogin(cfg,name,data,rosterAthlete){
    const mg=(data.competitions||[]).map(migrateComp).filter(Boolean);
    setConfig(cfg);setComps(mg);subscribeFirebase(cfg);
    if(rosterAthlete){
      setRosterProfile(rosterAthlete);
      try{localStorage.setItem("defcon_ath_roster",JSON.stringify(rosterAthlete));}catch{}
    }
    const nl=normalizeName(name);
    const found=[];
    mg.forEach(comp=>comp.athletes.forEach(ath=>{if(normalizeName(ath.name)===nl)found.push({comp,athlete:ath});}));
    // Accès même sans compétition (profil roster uniquement)
    if(found.length>0)setCompChoices(found);
    else setCompChoices([]);
  }
  function backToCompChoices(){
    setLiveMode(false);setSelCompId(null);setSelAthleteId(null);setShowProfile(false);setHomeTab("competitions");
  }
  function disconnect(){
    localStorage.removeItem("defcon_ath_compId");localStorage.removeItem("defcon_ath_athId");localStorage.removeItem("defcon_ath_roster");
    if(esRef.current){esRef.current.close();esRef.current=null;}
    setConfig(null);setSelCompId(null);setSelAthleteId(null);setMatches(null);setCompChoices(null);setComps([]);setLiveMode(false);setRosterProfile(null);setShowProfile(false);setHomeTab("competitions");
  }
  function updAthlete(updatedAth){
    isDirty.current=true;
    setComps(prev=>prev.map(c=>c.id!==selCompId?c:{...c,athletes:c.athletes.map(a=>a.id===updatedAth.id?updatedAth:a)}));
  }

  const{inp,btnGold,btnGhost,btnSm,btnDanger}=styles;

  // ─── États de rendu ───────────────────────────────────────────────────────
  if(loading)return(<ThemeCtx.Provider value={themeValue}><div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",background:C.bg,color:C.muted,fontFamily:"'DM Mono',monospace",fontSize:12,letterSpacing:"0.14em"}}>DEFCON ·</div></ThemeCtx.Provider>);
  if(!config)return(<ThemeCtx.Provider value={themeValue}><div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",overflow:"hidden"}}><LoginScreen onLogin={handleLogin} initialErr={autoErr}/></div></ThemeCtx.Provider>);
  if(matches!==null){
    const storedName=localStorage.getItem("defcon_ath_name")||"";
    if(matches.length===0)return(<ThemeCtx.Provider value={themeValue}><div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:16}}><div style={{fontSize:40}}>🔍</div><div style={{fontSize:17,fontWeight:800,color:C.text,textAlign:"center"}}>Profil introuvable</div><div style={{fontSize:13,color:C.muted,textAlign:"center",lineHeight:1.6,maxWidth:320}}>Le profil <strong style={{color:C.gold}}>{storedName}</strong> n'est plus disponible.<br/><br/>Demande à ton coach de vérifier que ton profil existe bien dans l'app, puis reconnecte-toi.</div><button onClick={()=>{setMatches(null);setConfig(null);}} style={{...btnGold,maxWidth:280}}>← Se reconnecter</button></div></ThemeCtx.Provider>);
    return(<ThemeCtx.Provider value={themeValue}><div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",overflow:"hidden"}}><AthletePicker matches={matches} onPick={pickAthlete} onBack={disconnect}/></div></ThemeCtx.Provider>);
  }

  // ─── Écran accueil athlète (profil + compétitions) ────────────────────────
  if(compChoices&&!liveMode&&!selCompId){
    const athName=localStorage.getItem("defcon_ath_name")||"";
    const initials=athName.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
    const b=rosterProfile?.bestLifts||{};
    // Vue profil complet
    if(showProfile&&rosterProfile){
      return(
        <ThemeCtx.Provider value={themeValue}>
          <div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <AthleteProfileScreen rosterAthlete={rosterProfile} onBack={()=>setShowProfile(false)}/>
          </div>
        </ThemeCtx.Provider>
      );
    }
    return(
      <ThemeCtx.Provider value={themeValue}>
        <div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* Header */}
          <div style={{borderBottom:`1px solid ${C.border}`,background:C.headerBg,backdropFilter:"blur(16px)",flexShrink:0}}>
            <div style={{height:2,background:`linear-gradient(90deg,transparent,${C.gold}55,${C.gold}80,${C.gold}55,transparent)`}}/>
            <div style={{padding:"10px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:20,height:20,borderRadius:5,
                  background:`linear-gradient(135deg,${C.gold}2A,${C.gold}0E)`,
                  border:`1px solid ${C.goldBorder}`,
                  display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <div style={{width:9,height:9,borderRadius:2,border:`1.5px solid ${C.gold}`,background:`${C.gold}40`}}/>
                </div>
                <span style={{fontWeight:800,fontSize:13,color:C.text,letterSpacing:"0.04em"}}>DEFCON</span>
                <span style={{fontSize:8,color:C.gold,letterSpacing:"0.24em",fontWeight:700,opacity:0.85}}>ATHLETE</span>
              </div>
              <div style={{display:"flex",gap:7,alignItems:"center"}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:syncErr?C.red:syncing?C.gold:C.green,opacity:0.9}}/>
                <button onClick={toggleTheme} style={btnSm}>{darkMode?"☀️":"🌙"}</button>
                <button onClick={disconnect} style={btnSm}>Déco.</button>
              </div>
            </div>
          </div>
          {/* Tab bar */}
          <div style={{display:"flex",borderBottom:`1px solid ${C.border}`,background:C.navBg,flexShrink:0}}>
            {[
              {id:"competitions",label:"Mes Compétitions",icon:"🏆"},
              {id:"calendrier",label:"Calendrier",icon:"📅"},
              {id:"reglement",label:"Règlement",icon:"📋"},
            ].map(tab=>{
              const isActive=homeTab===tab.id;
              return(
                <button key={tab.id} onClick={()=>setHomeTab(tab.id)}
                  style={{flex:1,padding:"11px 8px",border:"none",background:"transparent",
                    color:isActive?C.gold:C.muted,
                    fontSize:11,fontWeight:700,letterSpacing:"0.06em",
                    borderBottom:isActive?`2px solid ${C.gold}`:"2px solid transparent",
                    display:"flex",alignItems:"center",justifyContent:"center",gap:6,
                    cursor:"pointer",transition:"color 0.18s, border-color 0.18s"}}>
                  <span style={{fontSize:13}}>{tab.icon}</span>
                  <span style={{whiteSpace:"nowrap"}}>{tab.label}</span>
                </button>
              );
            })}
          </div>
          {/* Content par onglet */}
          {homeTab==="calendrier"&&<FFCalendarScreen/>}
          {homeTab==="reglement"&&<FFReglementScreen/>}
          {homeTab==="competitions"&&(
          <div className="scrollable" style={{flex:1,overflowY:"auto",padding:"14px 16px",display:"flex",flexDirection:"column",gap:14}}>
            {/* Carte identité */}
            <div style={{display:"flex",alignItems:"center",gap:14,padding:"16px",
              background:rosterProfile?`linear-gradient(135deg,${C.gold}0C,${C.surface})`:C.surface,
              border:`1px solid ${rosterProfile?C.goldBorder:C.border}`,borderRadius:16,
              boxShadow:rosterProfile?`0 4px 24px ${C.gold}08`:"none"}}>
              <div style={{width:50,height:50,borderRadius:"50%",flexShrink:0,
                background:rosterProfile?`linear-gradient(135deg,${C.gold}2A,${C.gold}0E)`:C.surface2,
                border:`1.5px solid ${rosterProfile?C.goldBorder:C.border2}`,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:16,fontWeight:800,color:rosterProfile?C.gold:C.muted}}>
                {initials}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:16,fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{athName}</div>
                {rosterProfile&&(
                  <div style={{display:"flex",gap:5,marginTop:5,flexWrap:"wrap"}}>
                    {rosterProfile.category&&<span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:20,background:C.goldDim,color:C.gold,border:`1px solid ${C.goldBorder}`,letterSpacing:"0.04em"}}>{rosterProfile.category}</span>}
                    <span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:20,background:C.blueDim,color:C.blue,border:`1px solid ${C.blueBorder}`,letterSpacing:"0.04em"}}>IPF</span>
                  </div>
                )}
              </div>
              {rosterProfile&&(
                <button onClick={()=>setShowProfile(true)}
                  style={{background:C.goldDim,border:`1px solid ${C.goldBorder}`,borderRadius:10,
                    color:C.gold,fontSize:11,fontWeight:700,padding:"8px 12px",flexShrink:0,
                    cursor:"pointer",letterSpacing:"0.04em"}}>
                  Profil →
                </button>
              )}
            </div>
            {/* Best lifts résumé (si roster) */}
            {rosterProfile&&(b.squat||b.bench||b.deadlift)&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:7}}>
                {[
                  {label:"SQ",val:b.squat,color:C.squat},
                  {label:"BP",val:b.bench,color:C.bench},
                  {label:"DL",val:b.deadlift,color:C.deadlift},
                  {label:"TOT",val:b.total,color:C.text},
                ].map(s=>(
                  <div key={s.label} style={{padding:"10px 6px",borderRadius:12,
                    background:`linear-gradient(145deg,${s.color}0C,${C.surface})`,
                    border:`1px solid ${s.color}28`,textAlign:"center",position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,height:1.5,background:`linear-gradient(90deg,transparent,${s.color}40,transparent)`}}/>
                    <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5,fontWeight:700}}>{s.label}</div>
                    <div style={{fontSize:18,fontWeight:800,color:s.color,fontFamily:"'DM Mono',monospace",lineHeight:1}}>{s.val||"—"}</div>
                  </div>
                ))}
              </div>
            )}
            {/* Section Compétitions */}
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <div style={{fontSize:9,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:"0.18em"}}>Mes compétitions</div>
                <div style={{flex:1,height:"1px",background:C.border}}/>
              </div>
              {compChoices.length===0&&(
                <div style={{textAlign:"center",padding:"28px 20px",background:C.surface,border:`1px solid ${C.border}`,borderRadius:14}}>
                  <div style={{fontSize:28,marginBottom:8}}>🏆</div>
                  <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>Pas encore inscrit</div>
                  <div style={{fontSize:12,color:C.muted,lineHeight:1.6}}>Ton coach ne t'a pas encore ajouté à une compétition. Reviens plus tard !</div>
                </div>
              )}
              {compChoices.map(({comp,athlete},i)=>{
                const group=comp.groups?.find(g=>g.id===athlete.groupId);
                const d=daysUntil(comp.date);
                return(
                  <button key={i} onClick={()=>pickCompetition(comp,athlete)}
                    style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:16,padding:"16px",
                      textAlign:"left",display:"flex",flexDirection:"column",gap:9,width:"100%",
                      cursor:"pointer",marginBottom:10,transition:"border-color 0.18s, background 0.18s"}}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
                      <div style={{fontSize:15,fontWeight:800,color:C.text,lineHeight:1.3}}>{comp.name}</div>
                      {d!==null&&<span style={{fontSize:9,fontWeight:800,flexShrink:0,letterSpacing:"0.08em",
                        color:d===0?C.red:d>0?C.gold:C.muted,
                        background:d===0?C.redDim:d>0?C.goldDim:C.surface2,
                        border:`1px solid ${d===0?C.redBorder:d>0?C.goldBorder:C.border}`,
                        borderRadius:6,padding:"3px 9px"}}>{d===0?"AUJOURD'HUI":d>0?`J-${d}`:`J+${Math.abs(d)}`}</span>}
                    </div>
                    <div style={{fontSize:11,color:C.muted,letterSpacing:"0.02em"}}>{comp.date?formatDate(comp.date):"Date non définie"} · {comp.compStartTime||"—"}</div>
                    {group&&<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontSize:10,color:C.muted,background:C.surface2,border:`1px solid ${C.border}`,borderRadius:6,padding:"2px 9px"}}>{group.name} · Pos. #{athlete.movements?.squat?.position||1}</span>
                    </div>}
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:2}}>
                      <div style={{height:1,flex:1,background:C.border,marginRight:12}}/>
                      <span style={{fontSize:11,color:C.gold,fontWeight:700,letterSpacing:"0.06em"}}>LANCER →</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
          )}
        </div>
      </ThemeCtx.Provider>
    );
  }

  const selComp=comps.find(c=>c.id===selCompId);
  const selAth=selComp?.athletes?.find(a=>a.id===selAthleteId);
  if(!selComp||!selAth)return(<ThemeCtx.Provider value={themeValue}><div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:16}}><div style={{fontSize:40}}>⚠️</div><div style={{fontSize:15,fontWeight:800,color:C.text}}>Profil introuvable</div><div style={{fontSize:12,color:C.muted,textAlign:"center",lineHeight:1.6,maxWidth:280}}>Reconnecte-toi pour recharger tes données.</div><button onClick={disconnect} style={{...btnGold,maxWidth:260}}>Se reconnecter</button></div></ThemeCtx.Provider>);

  // Données calculées à chaque render selon selMov
  const group=selComp.groups?.find(g=>g.id===selAth.groupId);
  const days=daysUntil(selComp.date);
  const delay=selComp.liveDelay||0; // retard synchronisé depuis l'app coach
  const athMov=selAth.movements[selMov]||defaultMovement();
  const compStart=getMovStartTime(selComp,selAth.groupId,selMov);
  const schedule=computeSchedule(athMov,compStart,athMov.position||1,delay);
  const liftMin=timeToMinutes(compStart)+(athMov.position||1)-1+delay;
  const doneSets=athMov.doneSets||{};
  const nextSc=schedule.find(sc=>!doneSets[setKey(sc)]);
  const allDone=schedule.length>0&&schedule.every(sc=>!!doneSets[setKey(sc)]);
  const mc=movColor(C,selMov);
  const movIdx=MOV_ORDER.indexOf(selMov);
  const firstSc=schedule.find(s=>s.type==="general")||schedule[0];

  function updMov(k,v){isDirty.current=true;updAthlete({...selAth,movements:{...selAth.movements,[selMov]:{...athMov,[k]:v}}});}
  function toggleDone(sc){const k=setKey(sc);updMov("doneSets",{...doneSets,[k]:!doneSets[k]});}

  // ─── Composant MovPills ───────────────────────────────────────────────────
  const MovPills=()=>(
    <div style={{display:"flex",background:darkMode?"rgba(0,0,0,0.45)":C.surface2,borderRadius:14,padding:4,gap:3,border:`1px solid ${C.border}`}}>
      {MOV_ORDER.map(mk=>{
        const mc2=movColor(C,mk);const start=getMovStartTime(selComp,selAth.groupId,mk);const isAct=selMov===mk;
        return(<button key={mk} onClick={()=>{setSelMov(mk);}}
          style={{flex:1,padding:"10px 6px 9px",borderRadius:10,border:"none",fontSize:12,fontWeight:700,
            letterSpacing:"0.04em",
            background:isAct?`${mc2}1E`:"transparent",
            color:isAct?mc2:C.muted,
            borderBottom:isAct?`2px solid ${mc2}`:"2px solid transparent",
            boxShadow:isAct?`0 2px 16px ${mc2}16`:"none",
            transition:"all 0.2s cubic-bezier(0.22,1,0.36,1)",
            display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <span>{mk==="squat"?"SQ":mk==="bench"?"BP":"DL"}</span>
          <span style={{fontSize:9,fontFamily:"'DM Mono',monospace",fontWeight:isAct?600:400,opacity:isAct?0.9:0.55}}>{start}</span>
        </button>);
      })}
    </div>
  );

  // ─── Header ───────────────────────────────────────────────────────────────
  const Header=({isLive=false})=>(
    <div style={{borderBottom:`1px solid ${C.border}`,background:C.headerBg,backdropFilter:"blur(16px)",flexShrink:0}}>
      {/* Accent top */}
      {isLive
        ? <div style={{height:2,background:`linear-gradient(90deg,transparent,${C.red}70,${C.red},${C.red}70,transparent)`}}/>
        : <div style={{height:2,background:`linear-gradient(90deg,transparent,${C.gold}50,${C.gold}75,${C.gold}50,transparent)`}}/>
      }
      <div style={{padding:"9px 16px 9px"}}>
        {/* Row 1: brand + controls */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:9}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {isLive&&<button onClick={backToCompChoices} style={{...btnSm,padding:"4px 10px",fontSize:11}}>←</button>}
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <div style={{width:18,height:18,borderRadius:4,
                background:`linear-gradient(135deg,${C.gold}28,${C.gold}0C)`,
                border:`1px solid ${C.goldBorder}`,
                display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <div style={{width:8,height:8,borderRadius:2,border:`1.5px solid ${C.gold}`,background:`${C.gold}3A`}}/>
              </div>
              <span style={{fontWeight:800,fontSize:13,color:C.text,letterSpacing:"0.04em"}}>DEFCON</span>
              <span style={{fontSize:8,color:C.gold,letterSpacing:"0.22em",fontWeight:700,opacity:0.85}}>ATHLETE</span>
              {isLive&&<span className="live-badge" style={{fontSize:8,background:C.redDim,color:C.red,padding:"2px 7px",borderRadius:4,letterSpacing:"0.14em",fontWeight:800,border:`1px solid ${C.redBorder}`}}>LIVE</span>}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:5,height:5,borderRadius:"50%",background:syncErr?C.red:syncing?C.gold:C.green,opacity:0.9}}/>
            <button onClick={reqNotifs} style={{...btnSm,background:notifGranted?C.greenDim:C.goldDim,border:`1px solid ${notifGranted?C.greenBorder:C.goldBorder}`,color:notifGranted?C.green:C.gold}}>{notifGranted?"🔔":"🔕"}</button>
            <button onClick={toggleTheme} style={btnSm}>{darkMode?"☀️":"🌙"}</button>
            {!isLive&&<button onClick={disconnect} style={btnSm}>Déco.</button>}
          </div>
        </div>
        {/* Row 2: comp name + days badge */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:8,flexWrap:"wrap"}}>
          <div style={{minWidth:0}}>
            <div style={{fontSize:15,fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",letterSpacing:"0.01em"}}>{selComp.name}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2,letterSpacing:"0.03em"}}>{selComp.date?formatDate(selComp.date):"Date non définie"} · {selComp.compStartTime}</div>
          </div>
          {days!==null&&<span style={{fontSize:9,fontWeight:800,flexShrink:0,letterSpacing:"0.1em",
            color:days===0?C.red:days>0?C.gold:C.muted,
            background:days===0?C.redDim:days>0?C.goldDim:C.surface,
            border:`1px solid ${days===0?C.redBorder:days>0?C.goldBorder:C.border}`,
            borderRadius:6,padding:"3px 10px"}}>{days===0?"AUJOURD'HUI":days>0?`J-${days}`:`J+${Math.abs(days)}`}</span>}
        </div>
        {/* Row 3: athlete chip */}
        <div style={{display:"flex",alignItems:"center",gap:9,padding:"7px 11px",
          background:`${C.gold}0F`,border:`1px solid ${C.goldBorder}`,borderRadius:10}}>
          <div style={{width:26,height:26,borderRadius:"50%",
            background:C.goldDim,border:`1px solid ${C.goldBorder}`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:10,fontWeight:800,color:C.gold,flexShrink:0,letterSpacing:"0.02em"}}>
            {selAth.name.trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase()}
          </div>
          <span style={{fontSize:12,fontWeight:800,color:C.gold}}>{selAth.name}</span>
          <span style={{fontSize:10,color:C.muted,marginLeft:1}}>{group?.name||"Groupe"} · #{athMov.position||1}</span>
          {delay>0&&<span style={{marginLeft:"auto",fontSize:10,fontWeight:700,fontFamily:"'DM Mono',monospace",color:C.red,background:C.redDim,border:`1px solid ${C.redBorder}`,borderRadius:6,padding:"2px 8px"}}>+{delay}min</span>}
        </div>
      </div>
    </div>
  );

  // ═══════════════════════════════════════════════════════════════════════════
  // ─── MODE LIVE — style identique à LaunchCard ─────────────────────────────
  // ═══════════════════════════════════════════════════════════════════════════
  if(liveMode)return(
    <ThemeCtx.Provider value={themeValue}>
      <div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <Header isLive/>

        {/* MovPills */}
        <div style={{padding:"8px 14px 0",flexShrink:0}}>
          <MovPills/>
        </div>

        {/* Bandeau timing */}
        <div style={{padding:"6px 14px 8px",flexShrink:0,borderBottom:`1px solid ${C.border}`}}>
          <div style={{display:"flex",gap:12,padding:"11px 14px",
            background:`linear-gradient(135deg,${mc}12,${mc}06)`,
            borderRadius:12,border:`1px solid ${mc}30`,
            flexWrap:"wrap",alignItems:"center"}}>
            <div>
              <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.16em",marginBottom:3,fontWeight:700}}>{athMov.generalWarmup?.enabled!==false?"Départ éch.":"1ère barre"}</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:22,fontWeight:700,color:mc,lineHeight:1}}>{firstSc?.startTime||"—"}</div>
            </div>
            <div style={{width:1,height:30,background:`${mc}30`,flexShrink:0}}/>
            <div>
              <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.16em",marginBottom:3,fontWeight:700}}>Passage</div>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:22,fontWeight:700,color:"#d89060",lineHeight:1}}>{minutesToTime(liftMin)}</div>
            </div>
            {athMov.openerWeight&&<>
              <div style={{width:1,height:30,background:`${mc}30`,flexShrink:0}}/>
              <div>
                <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.16em",marginBottom:3,fontWeight:700}}>Opener</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:22,fontWeight:700,color:mc,lineHeight:1}}>{athMov.openerWeight} <span style={{fontSize:12,fontWeight:600,opacity:0.6}}>kg</span></div>
              </div>
            </>}
          </div>
        </div>

        {/* Schedule — IDENTIQUE au LaunchCard */}
        <div className="scrollable" style={{flex:1,padding:"10px 14px",display:"flex",flexDirection:"column",gap:5}}>
          {schedule.map((sc,i)=>{
            const k=setKey(sc);const isDone=!!doneSets[k];const isNext=sc===nextSc&&!allDone;
            const diff=sc.startMin*60-nowSeconds();const isUrgent=!isDone&&Math.abs(diff)<90;const isGeneral=sc.type==="general";
            return(
              <div key={sc.id||i} style={{display:"grid",gridTemplateColumns:"26px 1fr auto auto 36px",gap:8,alignItems:"center",
                padding:"10px 11px",borderRadius:11,transition:"all 0.22s",
                background:isDone?C.greenDim:isUrgent?C.goldDim:isNext?C.surface2:"transparent",
                border:`1px solid ${isDone?C.greenBorder:isUrgent?C.goldBorder:isNext?C.border2:"transparent"}`,
                opacity:isDone?0.48:1}}>
                <div style={{width:22,height:22,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",
                  background:isGeneral?C.blueDim:C.surface,border:`1px solid ${isGeneral?C.blueBorder:C.border}`,flexShrink:0}}>
                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:isGeneral?C.blue:C.muted,fontWeight:600}}>{isGeneral?"~":i}</span>
                </div>
                {isGeneral
                  ?<span style={{fontSize:13,fontWeight:isDone?400:600,color:isDone?C.muted:C.blue,lineHeight:1.3}}>Éch. général <span style={{fontSize:10,color:C.muted,fontWeight:400}}>{sc.duration}min</span></span>
                  :<span style={{fontFamily:"'DM Mono',monospace",fontSize:16,fontWeight:isDone?400:600,color:isDone?C.muted:isNext?mc:C.text,textDecoration:isDone?"line-through":"none",lineHeight:1}}>{sc.weight} <span style={{fontSize:10,color:C.muted,fontWeight:400}}>kg</span></span>
                }
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:isDone?C.muted:C.text,letterSpacing:"0.04em"}}>{sc.startTime}</span>
                {isDone?<span style={{fontSize:11,color:C.green,fontWeight:700}}>✓</span>:isNext?<Countdown targetMin={sc.startMin} sm/>:<span/>}
                <button onClick={()=>toggleDone(sc)} style={{width:34,height:34,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",
                  background:isDone?C.greenDim:C.surface2,
                  border:`1px solid ${isDone?C.greenBorder:C.border}`,
                  color:isDone?C.green:C.muted,fontSize:15,fontWeight:700}}>
                  {isDone?"✓":"○"}
                </button>
              </div>
            );
          })}

          {/* Opener row */}
          {athMov.openerWeight&&(
            <div style={{display:"grid",gridTemplateColumns:"26px 1fr auto auto 36px",gap:8,alignItems:"center",
              padding:"10px 11px",borderRadius:11,
              background:`linear-gradient(135deg,${mc}10,${mc}06)`,
              border:`1px solid ${mc}38`}}>
              <div style={{width:22,height:22,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",background:`${mc}1A`,border:`1px solid ${mc}38`}}>
                <span style={{color:mc,fontSize:11,fontWeight:800}}>★</span>
              </div>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:16,fontWeight:600,color:mc}}>{athMov.openerWeight} <span style={{fontSize:10,color:C.muted,fontWeight:400}}>kg opener</span></span>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,color:"#d89060",letterSpacing:"0.04em"}}>{minutesToTime(liftMin)}</span>
              <Countdown targetMin={liftMin} sm/>
              <span/>
            </div>
          )}

          {/* Plan de match déroulant (comme LaunchCard) */}
          {athMov.openerWeight&&(
            <details style={{marginTop:2}}>
              <summary style={{cursor:"pointer",fontSize:11,color:C.muted,padding:"4px 0",listStyle:"none",display:"flex",alignItems:"center",gap:4}}>
                <span>▸</span> PLAN DE MATCH
              </summary>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:8}}>
                {PLANS.map(p=>(
                  <div key={p.key} style={{background:`${planColor(C,p.key)}0A`,border:`1px solid ${planColor(C,p.key)}22`,borderRadius:7,padding:"8px 6px"}}>
                    <div style={{fontSize:9,color:planColor(C,p.key),fontWeight:700,textAlign:"center",marginBottom:6,letterSpacing:"0.06em"}}>{p.label.toUpperCase()}</div>
                    {[{k:"attempt2",l:"2ème"},{k:"attempt3",l:"3ème"}].map(a=>(
                      <div key={a.k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                        <span style={{fontSize:9,color:C.muted}}>{a.l}</span>
                        <span style={{fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:600,color:planColor(C,p.key)}}>
                          {athMov.gamePlan?.[a.k]?.[p.key]||"—"}{athMov.gamePlan?.[a.k]?.[p.key]?" kg":""}
                        </span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </details>
          )}

          {/* Navigation entre mouvements */}
          <div style={{display:"flex",gap:8,marginTop:6}}>
            {movIdx>0&&(
              <button onClick={()=>setSelMov(MOV_ORDER[movIdx-1])} style={{...btnGhost,fontSize:12,padding:"9px 12px",flex:1}}>
                ← {MOV_ORDER[movIdx-1]==="squat"?"Squat":MOV_ORDER[movIdx-1]==="bench"?"Bench":"Deadlift"}
              </button>
            )}
            {allDone&&movIdx<MOV_ORDER.length-1&&(
              <button onClick={()=>{updAthlete({...selAth,currentMovement:MOV_ORDER[movIdx+1]});setSelMov(MOV_ORDER[movIdx+1]);}} style={{...btnGold,fontSize:13,padding:"12px",flex:2}}>
                → {MOV_ORDER[movIdx+1]==="squat"?"Squat":MOV_ORDER[movIdx+1]==="bench"?"Bench":"Deadlift"}
              </button>
            )}
            {allDone&&movIdx===MOV_ORDER.length-1&&(
              <div style={{textAlign:"center",padding:"10px",color:C.green,fontSize:13,fontWeight:700,flex:1}}>✅ Terminé !</div>
            )}
          </div>
          <div style={{height:10}}/>
        </div>
      </div>
      <NotifBanner/>
    </ThemeCtx.Provider>
  );

  // ═══════════════════════════════════════════════════════════════════════════
  // ─── VUE PRÉPARATION ──────────────────────────────────────────────────────
  return(
    <ThemeCtx.Provider value={themeValue}>
      <div style={{height:"100dvh",background:C.bg,color:C.text,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <Header/>

        {/* MovPills */}
        <div style={{padding:"8px 16px 0",flexShrink:0}}>
          <MovPills/>
        </div>

        {/* Timing summary */}
        {firstSc&&(
          <div style={{padding:"8px 16px 0",flexShrink:0}}>
            <div style={{display:"flex",gap:14,padding:"13px 15px",
              background:`linear-gradient(135deg,${mc}14,${mc}07)`,
              borderRadius:13,border:`1px solid ${mc}32`,flexWrap:"wrap",alignItems:"center"}}>
              <div>
                <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.18em",marginBottom:3,fontWeight:700}}>{athMov.generalWarmup?.enabled!==false?"Départ éch.":"1ère barre"}</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:24,fontWeight:700,color:mc,lineHeight:1}}>{firstSc.startTime}</div>
              </div>
              <div style={{width:1,height:34,background:`${mc}28`,flexShrink:0}}/>
              <div>
                <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.18em",marginBottom:3,fontWeight:700}}>Passage</div>
                <div style={{fontFamily:"'DM Mono',monospace",fontSize:24,fontWeight:700,color:"#d89060",lineHeight:1}}>{minutesToTime(liftMin)}</div>
              </div>
              {athMov.openerWeight&&<>
                <div style={{width:1,height:34,background:`${mc}28`,flexShrink:0}}/>
                <div>
                  <div style={{fontSize:8,color:C.muted,textTransform:"uppercase",letterSpacing:"0.18em",marginBottom:3,fontWeight:700}}>Opener</div>
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:24,fontWeight:700,color:mc,lineHeight:1}}>{athMov.openerWeight} <span style={{fontSize:12,opacity:0.6}}>kg</span></div>
                </div>
              </>}
              <div style={{marginLeft:"auto"}}><Countdown targetMin={firstSc.startMin}/></div>
            </div>
          </div>
        )}

        {/* Plan de match — lecture seule */}
        {athMov.openerWeight&&(
          <div className="scrollable" style={{flex:1,padding:"12px 16px",display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.12em",fontWeight:700}}>Plan de match</div>
            {[{key:"attempt2",label:"2ème essai"},{key:"attempt3",label:"3ème essai"}].map(att=>(
              <div key={att.key}>
                <div style={{fontSize:10,color:C.muted,letterSpacing:"0.1em",marginBottom:6,fontWeight:600}}>{att.label}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                  {PLANS.map(p=>{
                    const pc=planColor(C,p.key);const val=athMov.gamePlan?.[att.key]?.[p.key];
                    return(
                      <div key={p.key} style={{background:`linear-gradient(145deg,${pc}0C,${pc}04)`,border:`1px solid ${pc}28`,borderRadius:11,padding:"13px 8px",textAlign:"center",position:"relative",overflow:"hidden"}}>
                        <div style={{position:"absolute",top:0,left:0,right:0,height:1.5,background:`linear-gradient(90deg,transparent,${pc}45,transparent)`}}/>
                        <div style={{fontSize:8,color:pc,fontWeight:700,letterSpacing:"0.1em",marginBottom:9,opacity:0.9}}>{p.label.toUpperCase()}</div>
                        <div style={{fontFamily:"'DM Mono',monospace",fontSize:22,fontWeight:800,color:val?pc:C.muted,lineHeight:1}}>{val||"—"}</div>
                        {val&&<div style={{fontSize:9,color:C.muted,marginTop:5,letterSpacing:"0.06em"}}>KG</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}
        {!athMov.openerWeight&&<div style={{flex:1}}/>}

        {/* Bouton Lancer */}
        <div style={{padding:"16px 16px 28px",borderTop:`1px solid ${C.border}`,flexShrink:0,background:C.navBg}}>
          <button onClick={()=>{initAudio();setLiveMode(true);}} style={{...btnGold,display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontSize:14,fontWeight:800,padding:"16px",letterSpacing:"0.1em"}}>
            LANCER LA COMPÉTITION →
          </button>
        </div>
      </div>
      <NotifBanner/>
    </ThemeCtx.Provider>
  );
}


const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
